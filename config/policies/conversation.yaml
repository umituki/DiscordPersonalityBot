# Conversation policy (spec 3.2 context limits, 16, 27.2, 40).
policy_version: 1

context:
  # 仕様 3.2: context 上限は 8192 から開始し実測で調整する。
  # ここは prompt 側に割り当てる概算 token 数。
  max_tokens: 3000
  chars_per_token: 2.0
  recent_turn_limit: 12
  recent_turn_max_chars: 600

generation:
  # Phase 3 §34: realizer は appraisal より高くてよい。
  # 高すぎると grounding repair が増えるので、実機評価で決める。
  realizer_temperature: 0.85
  # Dialogue v2: repair is a constrained rewrite. Candidate value, to be
  # compared against 0.85 on the real machine.
  repair_temperature: 0.4
  # Phase 3 §25: 2〜5 例。多いと真似になる。
  reference_limit: 4
  temperature: 0.8
  max_tokens: 400
  # spec 28.2: parse/schema 失敗のみ再試行する
  max_attempts: 2
  timeout_s: 90

reply:
  # Guard に拒否された場合、Phase 3 では黙る（誤った発話より無応答を選ぶ）。
  on_rejection: suppress

# patch spec 10: Conversation Quality Guard のしきい値。
quality:
  # 返事のうち USER の言葉そのままが占めてよい割合。
  max_echo_ratio: 0.6
  # これより短ければ、繰り返しても「おうむ返し」ではない。
  min_echo_chars: 8
  # 「さっき訊いたばかり」とみなす直近 YUI turn 数。
  recent_question_window: 3
