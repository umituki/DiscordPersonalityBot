# Memory policy (spec 10, 40).
#
# 忘却曲線・符号化閾値・想起スコア重みは科学的固定値ではない。実測と長期
# シミュレーションで調整する対象としてここに置く。
policy_version: 1

segmentation:
  # この時間だけ沈黙が続いたらエピソードを閉じる
  max_gap_minutes: 30
  max_events: 40
  max_duration_minutes: 180
  min_events_to_encode: 2
  # patch spec 15.1: 「ひと続き」の尺度は人生の種類ごとに違う。
  # 会話の 30 分の沈黙と、simulated past の 30 日は同じ意味ではない。
  by_origin:
    simulated_past:
      # 90 simulated 日。これより離れた出来事はひと続きではない。
      max_gap_minutes: 129600
      max_events: 12
      # 1 simulated 年でいったん区切る。
      max_duration_minutes: 525600
      min_events_to_encode: 2
    virtual_life:
      # 12 時間空いたら別の一日。
      max_gap_minutes: 720
      max_events: 20
      max_duration_minutes: 1440
      min_events_to_encode: 2

encoding:
  # spec 10.4: メッセージ単位では長期記憶化しない。エピソード単位で判定する。
  base_importance: 0.25
  weights:
    novelty: 0.25
    emotional_intensity: 0.30
    prediction_error: 0.20
    user_directed: 0.15
    substance: 0.10
  encode_threshold: 0.30
  initial_accessibility: 0.80
  initial_content_confidence: 0.75
  initial_source_confidence: 0.90
  initial_temporal_confidence: 0.70
  summary_max_chars: 400

forgetting:
  # accessibility の低下であって delete ではない (spec 10.5)
  daily_decay_rate: 0.12
  min_accessibility: 0.02
  # importance が高いほど decay が遅い
  importance_protection: 0.60
  # 消さない: floor に留める
  hard_delete: false

practice:
  # 想起は accessibility を上げるが、反芻には逓減がある (spec 10.5)
  boost: 0.15
  diminishing_factor: 0.5
  window_hours: 24
  # Phase 2 §2M。想起を繰り返すだけで永久に 100% 想起可能にはならない。
  # 実 DB では 1.0 に張り付いた記憶があり、それが「関係ない記憶が毎回出る」
  # 正のフィードバックの片側だった。数値は調整対象、上限があること自体は違う。
  max_accessibility: 0.90

# Retrieval は 4 段階に分かれている (rebuild spec 17.3, Phase 2)。
#   Stage 1 Candidate Generation   ここに accessibility は出てこない
#   Stage 2 Semantic Relevance     LLM が意味カテゴリで判定する hard gate
#   Stage 3 Recall Availability    ここで初めて accessibility を使う
#   Stage 4 Use / Practice         実際に使われたものだけ
# 「関係あるか」と「思い出せるか」を混ぜないことが要点である。
retrieval:
  limit: 4
  min_query_chars: 3
  recency_half_life_days: 14
  # strong は relevant より手がかりとして強い。
  strong_relevance_bonus: 0.15
  rerank_batch: 16

  # Stage 1。accessibility による候補入りをさせない (§2B)。
  candidates:
    min_query_chars: 3
    min_importance: 0.45
    default:
      pool: 20
      max_candidates: 16
      include_recent: false
      include_important: false
    by_mode:
      # 自分の人生についての質問。自伝 bridge と重要な記憶を広めに集める。
      AUTOBIOGRAPHICAL_FACT:
        pool: 30
        max_candidates: 20
        include_recent: false
        include_important: true
      # 「一番印象に残っているのは」は importance そのものへの質問である。
      REFLECTIVE:
        pool: 30
        max_candidates: 20
        include_recent: true
        include_important: true
      # cue から連想する。query が無いこともある。
      ASSOCIATIVE:
        pool: 24
        max_candidates: 16
        include_recent: true
        include_important: false
      DIARY_READING:
        pool: 30
        max_candidates: 20
        include_recent: true
        include_important: false
      # 自分の直前の主張を確かめるだけ。広く探さない。
      CORRECTION_CHECK:
        pool: 12
        max_candidates: 8
        include_recent: false
        include_important: false

  # Stage 3。ここで accessibility を使う。
  weights:
    accessibility: 0.45
    emotional_salience: 0.20
    importance: 0.20
    recency: 0.15

  # Stage 2 の閾値と Stage 3 の件数上限。0 件は常に正常な結果である (§2I)。
  default_relevance:
    accept_weak: false
    max_recalled: 3
    min_availability: 0.35
  by_mode:
    # 年齢を訊かれている。曖昧な記憶でも黙るより答えるほうがよい。
    AUTOBIOGRAPHICAL_FACT:
      accept_weak: true
      max_recalled: 3
      min_availability: 0.20
    REFLECTIVE:
      accept_weak: false
      max_recalled: 3
      min_availability: 0.30
    ASSOCIATIVE:
      accept_weak: false
      max_recalled: 2
      min_availability: 0.45
    DIARY_READING:
      accept_weak: true
      max_recalled: 5
      min_availability: 0.10
    CORRECTION_CHECK:
      accept_weak: false
      max_recalled: 2
      min_availability: 0.25

semantic:
  # 同じ内容が繰り返し現れたときに意味記憶へ昇格する
  promotion_support_count: 3
  initial_confidence: 0.45
  confidence_per_support: 0.10
  max_confidence: 0.90
