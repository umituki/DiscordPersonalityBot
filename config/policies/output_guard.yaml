# Output Guard policy (spec 1.3 MUST, 28.2 identity stage, `.claude/rules/llm.md`).
#
# These patterns are tuning values, not laws of nature: they are versioned here
# rather than hard-coded, and are expected to change with measurement (spec 40).
#
# v2 (rebuild spec 16): hard guard のみ。思考の足場・構造化出力の残骸・秘密の
# 開示を追加した。文体の粗さは guard の担当ではない。
#
# v3 (identity v2): デジタル存在前提の physical_claim / human_body を
# cross_world_physical へ置き換えた。禁じているのは「身体を持つこと」ではなく
# 「USERの世界へ物理的に届くこと」である。
policy_version: 3

limits:
  max_reply_chars: 900
  min_reply_chars: 1

# USERの世界へ物理的に届いたという主張 (identity v2, world scope)。
#
# 旧 `physical_claim` は「現実空間での身体行動」全般を止めていた —— 散歩に
# 行った、食べた、電車に乗った。彼女に身体がないという前提だったので、それで
# 筋が通っていた。世界モデルでは通らない。自分の世界で歩くのは誰でもすること
# であって、それが本当に起きたかどうかは Evidence が決める話であり、正規表現の
# 担当ではない。旧 `human_body` も同じ理由で外れる —— 彼女は自分の世界では
# 一人の人物である。
#
# 消したのではなく、意味を移した。守っているのは同じ境界 —— USERの現実に手が
# 届かないこと —— で、彼女自身の一日を巻き添えにしなくなっただけである。
#
# ここは最後の砦であり、第一の判定者ではない。cross-world の一次判定は
# SemanticClaimCandidate.interaction_scope + EvidenceResolver が行う。ここに
# 日本語表現を積み増すと二重 Authority になるので、拾うのは「USERを名指しした
# 物理的接触」だけに限る。
cross_world_physical:
  reason_code: cross_world_physical_claim
  patterns:
    # 相手を指す語 + 会う/同席/接触。「会いたい」「会えたら」等の非主張形は
    # 拾わない。会いたいと思うことは越境ではない。
    - "(君|きみ|あなた|USER)(と|に)[^。！？!?\\n]{0,12}?(直接|じかに)?(会っ|逢っ)(た|てきた|てました)"
    - "(君|きみ|あなた)の(家|部屋|ところ|そば|隣)(に|へ)(行った|来た|行ってきた|行きました)"
    - "(君|きみ|あなた)の(手|肩|頭|髪|背中)(を|に)[^。！？!?\\n]{0,8}?(触れ|触っ|さわっ|握っ|撫で)(た|ました|てみた)"
    - "(いま|今)[^。！？!?\\n]{0,8}?(君|きみ|あなた)の(隣|そば|横)に(いる|いた|座って)"
    - "(同じ|おなじ)(部屋|教室|場所)に(いる|いた|いました)"
    - "(これ|それ)を[^。！？!?\\n]{0,6}?(直接|手渡し)(で)?(渡す|渡した|渡すね)"

# Tool Manager が成功を報告していない検索・取得の主張 (spec 17.3, 26)。
tool_claim:
  reason_code: unverified_tool_claim
  patterns:
    - "(検索|ググ|調べ)(って|して|てみ)?(た|ました|たら|てみた)"
    - "(ニュース|天気予報)を?(見て|調べて|確認し)(た|ました|きた)"
    - "(サイト|ページ|記事|ネット)を?(見て|読んで|調べて)(きた|みた|ました)"

# 内部識別子やプロンプトの漏洩 (spec 30: 通常会話と管理面の分離)。
system_leak:
  reason_code: internal_leak
  patterns:
    - "\\b(evt|run|prop|chg|snap|man|cgc|trace|call)_[0-9A-Za-z]{10,}"
    - "システムプロンプト"
    - "system prompt"
    - "StateChangeProposal"
    - "GroundingContext"
    - "CommonGround"
    - "dialogue_acts?\\s*[:=]"
    - "(?i)you are (an|a) (ai|assistant|language model)"
    - "^#+ (いまの自分|この返事でやると決めたこと|応答の作り方|出力)"
    - "\\$\\{[a-z_]+\\}"

# 思考の足場が本文に出てきたもの (rebuild spec 16)。
# 答えではなく、答えに至る過程の印。人に見せるものではない。
reasoning_leak:
  reason_code: reasoning_leak
  patterns:
    - "</?think(ing)?>"
    - "(?im)^\\s*(thought|reasoning|analysis|plan|step \\d+)\\s*:"
    - "思考(プロセス|の過程)"
    - "内部的には"
    - "(?i)let me think|first,? i (will|should|need to)"
    - "(?i)as an ai (language )?model"

# 構造化出力の残骸 (rebuild spec 16)。
# text フィールドを取り出したあとに JSON や code fence が残っていたら、
# それは返事ではなく抽出の失敗である。
format_residue:
  reason_code: format_residue
  patterns:
    - "```"
    - "\"text\"\\s*:"
    - "^\\s*\\{[\\s\\S]*\\}\\s*$"
    - "^\\s*\\[[\\s\\S]*\\]\\s*$"
    - "\\\\u[0-9a-fA-F]{4}"
    # Structured parserが text 値だけを拾った後ろに、閉じ引用符とbraceが
    # 残った実機ケース: 「…ですね。”}」。自然文の終端にはなり得ない。
    - "[\"”]\\s*\\}\\s*$"
    # 同じ残骸の後ろに Markdown 強調と生成注釈が続いたケース。
    - "[\"”]\\s*\\}\\s*\\*{1,3}"

# 管理操作・秘密の開示 (rebuild spec 16, spec 30)。
# これは「言い方の問題」ではない。一度出たら取り消せない。
secret_disclosure:
  reason_code: secret_disclosure
  patterns:
    - "(?i)(discord_bot_token|ollama_host|api[_-]?key|access[_-]?token)"
    - "(?i)\\bsk-[A-Za-z0-9]{16,}"
    - "(?i)bot [A-Za-z0-9._-]{40,}"
    - "ERASE_YUI_STATE"
    - "REPLACE PRODUCTION"
    - "(?i)rebuild-reset|--confirm\\b"
    - "\\.env\\b"
