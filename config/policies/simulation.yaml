# Past simulation tuning values (spec 22, 40).
policy_version: 1

seed:
  # Spec 22.2: about seven questions, and they produce temperament only.
  expected_question_count: 7
  # Answers move temperament from the midpoint by at most this much, so a
  # questionnaire can bias a starting point and never specify a person.
  max_temperament_shift: 0.25
  neutral: 0.5

blocks:
  # Spec 22.5: stable stretches are compressed. A block is a month unless
  # something in it deserves expanding.
  compressed_block_days: 30.0
  expanded_block_days: 7.0
  max_blocks: 400
  # A block is expanded when its own drivers say something is happening.
  expansion_threshold: 0.55

experience:
  # Spec 22.4: the mix. Routine dominates a life, and it is meant to.
  routine_share: 0.72
  minor_share: 0.20
  meaningful_share: 0.065
  major_share: 0.013
  turning_point_share: 0.002
  # Spec 22.4: 「Major event をキャラクターの深みのために乱発しない」。
  # Hard ceilings per simulated year, enforced regardless of the shares above.
  max_major_per_year: 1.0
  max_turning_points_total: 3
  # Spec 22.4: 「Trauma を性格形成の便利な説明装置にしない」。
  max_negative_major_share: 0.5

knowledge:
  # How much of the period's available knowledge is put in front of YUI per
  # block. The exposure funnel then decides what, if anything, sticks.
  exposures_per_block: 4
  base_curiosity: 0.5

# patch spec 14: Genesis 終了時 1 回だけの consolidation を禁止する。
# 目的は Deep Gate を迂回することではなく、正しい simulated time と
# 複数 window の evidence を Gate へ届けること。
genesis:
  # 90 日は tuning 値。
  consolidation_interval_simulated_days: 90.0
  consolidate_on_phase_boundary: true
  consolidate_after_major_event: true
  final_consolidation: true
  major_classes: [major, turning_point]

first_boot:
  # Spec 22.7: every audit must pass. These are the thresholds the quality
  # audit uses; the others are pass/fail on their own terms.
  min_experiences: 20
  min_blocks: 12
  # 短い smoke run 用の下限。実際の multi-year Genesis には下の
  # *_multi_year が適用される (patch spec 17.2 / 17.3、禁止事項 5)。
  min_retained_knowledge: 0
  min_memories: 0

  # patch spec 17: 因果連鎖が実際に流れた証拠。どれかが 0 なら鎖が切れている。
  # 「238 experiences あったが心理は何も起きていない」がこの形だった。
  multi_year_threshold_years: 2.0
  min_appraised_simulated_events: 1
  min_state_effect_changes: 1
  min_encoding_attempts: 1
  # 「終了時 1 回だけ」を落とすため 2 以上。
  min_periodic_consolidations: 2
  min_knowledge_sources_or_candidates: 1
  min_knowledge_exposures: 1

  # patch spec 17.1: personality が動いたことではなく、成長機構が動いたこと。
  min_growth_evidence: 1
  require_deep_gate_evaluated: true

  # patch spec 17.2 / 17.3: multi-year run の下限。
  min_memories_multi_year: 1
  min_retained_knowledge_multi_year: 1
  min_encoding_attempts_multi_year: 2

  # patch spec 18: block audit。
  allow_zero_event_count_blocks: false
  min_distinct_block_summaries: 2
