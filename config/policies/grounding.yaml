# Grounding / 捏造防止 policy (rebuild spec 15).
#
# ここに書くのは「どの言い回しが事実主張になるか」だけである。
# どの Evidence がどの Claim を裏づけるかは構造であり app/grounding/models.py の
# ACCEPTED_EVIDENCE にある。緩めることは調整ではなく、別種の捏造を通す決定である。
#
# 誤検出は送信抑制につながる。だから hard は「言い切っている事実主張」に限る。
# 迷う言い回しは soft にして、記録はするが送信は止めない (spec 16 hard guard のみ)。
policy_version: 1

limits:
  # 1 draft から抽出する claim の上限。これ以上並ぶ返信は会話ではない。
  max_claims: 12

rules:
  # 「今日は本を読んだ」「さっき散歩してきた」
  # 完了した行為の主張。Activity か authoritative Event が要る (15.3)。
  - kind: yui_completed_action
    severity: hard
    patterns:
      # 時間の目印 + 完了。「さっき散歩してきた」のように し/て/き が挟まる。
      - "(?:今日|きょう|さっき|さきほど|先ほど|昨日|きのう|この前|こないだ|昼間|朝|夕方|夜)[^。！？!?\\n]{0,24}?(?:読ん|見|聞い|作っ|書い|食べ|飲ん|行っ|出かけ|散歩|勉強|練習|買っ|会っ|寝|起き)(?:し)?(?:て)?(?:き)?(?:た|だ)"
      - "(?:読ん|見|聞い|作っ|書い|食べ|飲ん|行っ|出かけ|散歩し|勉強し|練習し|買っ|会っ)(?:だ|た)(?:ばかり|ところ|んだ|の)"
      # 「何もしていない」は安全な否定だが、その後の「時間を過ごした」も
      # 今日の経験の主張である。曖昧な動詞だからと無証拠で通さない。
      - "(?:今日|きょう|さっき|先ほど|昨日|きのう|朝|昼|夕方|夜)[^。！？!?\\n]{0,32}?(?:時間を)?過ごし(?:た|ていた|ていました)"
      # 時間は質問側にだけ出ることがある。「今日は何してた？」への
      # 「静かに過ごしました」も、draft単体で今日を言い直さなくても経験である。
      - "^(?![^。！？!?\\n]{0,12}(?:あなた|君|きみ|彼|彼女|友達|USER)(?:は|が))[^。！？!?\\n]{0,32}?(?:時間を)?過ごし(?:た|ました|ていた|ていました)"
      # 短い問い返しでUSERの動詞を自分のものにする事故。
      # USER「詠んだよ」→「詩？」→YUI「はい、詠んだよ」を通さない。
      - "^(?:はい[、,]?\\s*)?(?:わたし|私)?(?:も)?[は、,]?\\s*(?:読ん|詠ん|見|聞い|書い|作っ|食べ|飲ん|行っ|買っ|会っ)(?:だ|た)(?:よ|ね)?[。]?$"

  # 「少し詠むと気持ちが落ち着く」— 一般論ではなく、YUIが自分の
  # 経験・習慣として話す形。直前にUSERが同じ動詞を使っていても、
  # それはYUIの経験にはならない。Activity/Event/Memory/Semantic rowが要る。
  - kind: yui_experience_habit
    severity: hard
    patterns:
      - "(?:読|詠|見|聞|書|作|食べ|飲|出かけ|散歩|勉強|練習|買|会)[^。！？!?\\n]{0,10}?(?:む|る|く|す|べる|んで|いて|して)(?:と|のが|ことが)[^。！？!?\\n]{0,24}?(?:好き|落ち着|楽しい|うれしい|安心|気持ち)"

  # 「いま雨が降ってる」「外は寒い」— 現在の世界についての言い切り。
  - kind: current_world_fact
    severity: hard
    patterns:
      - "(?:いま|今|外は|窓の外)[^。！？!?\\n]{0,20}?(?:雨|雪|晴れ|曇|暑|寒|暗|明る)[^。！？!?\\n]{0,8}?(?:だ|です|ってる|っている|降って|降っている|い)"

  # 「前に君が○○と言った」— USER の過去についての主張。
  # Conversation Event/turn か subjective memory が要る (15.3)。
  - kind: user_past_fact
    severity: hard
    patterns:
      - "(?:前に|以前|この前|さっき|昨日|きのう)[^。！？!?\\n]{0,24}?(?:君|きみ|あなた|USER)[^。！？!?\\n]{0,24}?(?:言っ|話し|教えて|書いて)(?:た|てた|てくれた)"
      - "(?:君|きみ|あなた)は[^。！？!?\\n]{0,20}?(?:だった|でしたよね|って言ってた|と言っていた)"

  # 記憶の主張は言い換えを列挙せず、memory_claim_review が発話全体を
  # semantic categoryへ分類し、current recall / Memory authorityと照合する。
  - kind: yui_memory_claim
    severity: hard
    patterns: []

  # 「調べてみたら」「検索したら」— Tool Manager が成功を報告した時だけ言える。
  - kind: tool_use
    severity: hard
    patterns:
      - "(?:調べ(?:て|た)|検索し(?:て|た)|ぐぐっ(?:て|た))(?:みたら|たら|た結果|ところ)"

  # 「○○は△△らしいよ」— 外部知識の断定。semantic memory か tool 結果が要る。
  # soft: 一般常識の言い回しと区別しきれない。記録はするが送信は止めない。
  - kind: external_knowledge_claim
    severity: soft
    patterns:
      - "(?:によると|によれば|というニュース|と報じられ)"

  # NPC についての事実。
  - kind: npc_fact
    severity: soft
    patterns:
      - "(?:友達|友だち|クラスメイト|同級生)の[^。！？!?\\n]{0,12}?(?:が|は)[^。！？!?\\n]{0,20}?(?:だった|してた|くれた)"

  # 「見えた」「聞こえた」— 知覚の主張。
  - kind: yui_perception
    severity: soft
    patterns:
      - "(?:見えた|聞こえた|匂いがした|音がした)"
