# YUI v2 static runtime settings.
# Secrets belong in .env, never here (spec 31.1).
config_version: 1

app:
  name: yui
  environment: development

paths:
  data_dir: data
  logs_dir: logs
  backups_dir: backups
  policies_dir: config/policies
  character_dir: character

database:
  filename: yui.db
  journal_mode: WAL
  synchronous: FULL
  busy_timeout_ms: 5000
  foreign_keys: true

runtime:
  # normal | degraded | minimal | offline (spec 28.3)
  mode: normal
  # internal reference timezone; all stored timestamps are UTC ISO-8601 (spec 38)
  timezone: UTC

logging:
  level: INFO
  file: yui.log
  format: "%(asctime)s %(levelname)s %(name)s %(message)s"

policies:
  state_arbitration: state_arbitration.yaml
  output_guard: output_guard.yaml
  conversation: conversation.yaml
  memory: memory.yaml
  psychology: psychology.yaml
  relationship: relationship.yaml
  belief_self: belief_self.yaml

prompts:
  directory: config/prompts

llm:
  provider: ollama
  base_url: http://127.0.0.1:11434
  model: qwen3.5:9b
  request_timeout_s: 120
  connect_timeout_s: 10
  # spec 3.2: concurrency 1, context starts at 8192 and is tuned by measurement
  concurrency: 1
  num_ctx: 8192
  temperature: 0.7
  keep_alive: 10m
  max_attempts: 3
  require_healthy_on_start: false
  trace_payloads: true
  max_traced_chars: 4000
