# Starter knowledge bundle — an example of the format, not a real dataset.
#
# Entries here are deliberately generic and long-running, so they are safe to
# ship and useless as a substitute for the real bundle for whatever period you
# are simulating. See README.md.
#
# `available_from` is when the thing became publicly knowable. That is what the
# temporal leakage guard checks against a simulated moment; it is not the date
# the source was written.
