# Capability Contract (rebuild spec 4.3): normal_reply
capability: "normal_reply"
trigger: "USER Discord message"
runtime_entry: "production DiscordGateway.handle_message -> ConversationService.handle_inbound -> DiscordGateway._send -> ConversationService.confirm_sent"
candidate_source: "ConversationEngine (social interpretation + surface plan + realizer)"
hard_gate: "admission + character-plane gate + response intent + OutputGuard + ConversationQualityGuard + ClaimGroundingGuard"
actual_action: "DiscordGateway._send exactly once, followed by confirm_sent only after transport success"
success_event: "YUI_MESSAGE_SENT"
persistence: "USER_MESSAGE_RECEIVED and YUI_MESSAGE_SENT events, both conversation_turn projections, conversation_traces, failures on transport error"
recovery: "an unconfirmed send is never projected or recorded as YUI_MESSAGE_SENT (CORE-004); projections are idempotent by event id"
observability: "!yui trace / conversation_traces"
acceptance_test: "tests/invariants/test_normal_reply_transport_e2e.py::test_normal_reply_production_transport_e2e"
status: "E2E_VERIFIED"
note: "deterministic offline production-transport E2E checks one send, post-send event ordering, turns and trace; negative cases cover send failure, suppression, silence, admission, admin bypass and closed character gate"
