# Capability Contract (rebuild spec 4.3, Phase 3 §45)
capability: "natural_conversation_realization"
trigger: "accepted USER Discord message"
runtime_entry: "ConversationService.handle_inbound → ConversationEngine.plan_turn"
candidate_source: "SocialInterpreter (one call) → SurfacePlanner (Python) → DialogueReferenceProvider"
hard_gate: "OutputGuard + ClaimGroundingGuard + ConversationQualityGuard (question budget)"
actual_action: "JapaneseRealizer generates the draft; DiscordGateway._send delivers it"
success_event: "YUI_MESSAGE_SENT"
persistence: "events, conversation_turns, conversation_traces (social/reference/realization stages), common_ground_claims"
recovery: "a failed or suppressed generation never creates a sent turn (CORE-004, GROUND-003)"
observability: "python -m app.main conversation-plan / conversation_traces"
acceptance_test: "tests/invariants/test_conversation_realization_e2e.py"
status: "E2E_VERIFIED"
note: "reply path drives every stage; intentional silence is Phase 4, and the real-Ollama gate for Phases 1-3 has not been run"
