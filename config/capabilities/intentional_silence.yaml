# Capability Contract (rebuild spec 4.3, 12)
capability: "intentional_silence"
trigger: "accepted USER message whose social reading does not call for speech"
runtime_entry: "ConversationService.handle_inbound → ConversationEngine.plan_turn → ResponseIntentGate.decide"
candidate_source: "SocialInterpretation.wants_to_speak (proposal only; no extra model call)"
hard_gate: "ResponseIntentGate veto — direct question, explicit request, correction, support, urgent, speech-act move"
actual_action: "nothing is sent; ConversationService._stay_silent records the decision"
success_event: "YUI_INTENTIONAL_SILENCE"
persistence: "events (own type), conversation_traces (outcome=intentional_silence, response_intent_* stages); no turn, no failure row"
recovery: "the decision is a row, not process state; a restart still shows she chose to leave the turn"
observability: "python -m app.main conversation-plan / conversation_traces / YUI_INTENTIONAL_SILENCE events"
acceptance_test: "tests/invariants/test_intentional_silence_e2e.py"
status: "E2E_VERIFIED"
note: "real-model silence scenarios are deferred to the final real-machine gate"
